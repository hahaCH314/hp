<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 実名とメールアドレスが載るページなので検索には載せない。
         特商法が求めるのは「購入者が容易に辿れること」で、フッターからのリンクで
         足りる。noindex はアクセスを妨げないので記載義務とは両立する。
         ⚠️ nofollow や robots.txt での遮断はしないこと（辿れなくすると義務違反になる） -->
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="CMCUBE の特定商取引法に基づく表記。" />
    <title>特定商取引法に基づく表記 — CMCUBE</title>
    <!-- JA専用ページなので hreflang は張らない。英語版に対応するページが無い -->
    <link rel="canonical" href="https://cmcubevercelapp.vercel.app/tokushoho/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
